    <!-- Body of Fa -->
    <path d="M362 254C362 216 338 186 298 186C254 186 226 218 226 260C226 298 250 326 288 326C306 326 324 318 334 306L334 318C334 336 318 350 290 350L178 350C150 350 138 334 142 308L148 274L114 274L104 318C96 358 122 388 174 388L294 388C344 388 372 358 372 312L372 264C368 260 364 256 362 254ZM296 290C274 290 262 276 262 256C262 234 274 220 296 220C318 220 330 234 330 256C330 276 318 290 296 290Z" />
